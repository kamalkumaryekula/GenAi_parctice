<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 0.9em;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #cancelBtn {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            display: none;
        }

        .logout-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            padding: 10px 20px;
            margin-left: 10px;
            width: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
        }

        .students-container {
            display: grid;
            gap: 20px;
        }

        .course-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .course-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .course-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f5f5f5;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .edit-btn {
            background: #2ecc71;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-btn:hover {
            background: #27ae60;
        }

        .no-students {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .error-message {
            background: #ff4757;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .authorized-users {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.85em;
        }

        .authorized-users h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .authorized-users ul {
            list-style: none;
            color: #666;
        }

        .authorized-users li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-header">
                <h2>🔐 Login</h2>
                <p>Student Management System</p>
            </div>
            
            <div class="error-message" id="loginError"></div>
            
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" autocomplete="current-password">
            </div>
            
            <button type="button" id="loginBtn">Login</button>

            <div class="authorized-users">
                <h4>Authorized Users:</h4>
                <ul>
                    <li>👤 admin / admin123</li>
                    <li>👤 teacher / teacher123</li>
                    <li>👤 staff / staff123</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Application (hidden initially) -->
    <div id="mainApp" class="hidden">
        <div class="container">
            <div class="header-bar">
                <h1>📚 Student Details Manager</h1>
                <div style="display: flex; align-items: center;">
                    <span class="user-info" id="currentUser"></span>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>
            
            <div class="form-container">
                <h2 style="margin-bottom: 20px; color: #333;" id="formTitle">Add New Student</h2>
                <div>
                    <div class="form-group">
                        <label for="rollNo">Roll Number:</label>
                        <input type="text" id="rollNo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="course">Course:</label>
                        <input type="text" id="course" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="section">Section:</label>
                        <input type="text" id="section" required>
                    </div>
                    
                    <div class="button-group">
                        <button type="button" id="addBtn">Add Student</button>
                        <button type="button" id="cancelBtn">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="students-container" id="studentsContainer"></div>
        </div>
    </div>

    <script>
        // Authorized users (in real application, this would be on a server)
        const authorizedUsers = {
            'admin': 'admin123',
            'teacher': 'teacher123',
            'staff': 'staff123'
        };

        let currentUser = null;
        const students = {};
        let editMode = false;
        let editCourse = null;
        let editIndex = null;

        const inputs = ['rollNo', 'name', 'course', 'section'];

        // Login functionality
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter both username and password';
                errorMsg.style.display = 'block';
                return;
            }

            if (authorizedUsers[username] && authorizedUsers[username] === password) {
                currentUser = username;
                errorMsg.style.display = 'none';
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('currentUser').textContent = `Welcome, ${username}`;
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                errorMsg.textContent = 'Invalid username or password';
                errorMsg.style.display = 'block';
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            clearForm();
            exitEditMode();
        }

        // Handle Enter key for login
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                login();
            }
        });

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Capitalize first letter function
        function capitalizeFirstLetter(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Add input event listeners for auto-capitalization
        inputs.forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('input', function(e) {
                const start = this.selectionStart;
                const end = this.selectionEnd;
                if (id === 'course') {
                    this.value = this.value.toUpperCase();
                } else {
                    this.value = capitalizeFirstLetter(this.value);
                }
                this.setSelectionRange(start, end);
            });
        });

        // Handle Enter key to move to next field
        inputs.forEach((id, index) => {
            const input = document.getElementById(id);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (index < inputs.length - 1) {
                        document.getElementById(inputs[index + 1]).focus();
                    } else {
                        document.getElementById('addBtn').click();
                    }
                }
            });
        });

        function addStudent() {
            const rollNo = document.getElementById('rollNo').value.trim();
            const name = document.getElementById('name').value.trim();
            const course = document.getElementById('course').value.trim();
            const section = document.getElementById('section').value.trim();
            
            if (!rollNo || !name || !course || !section) {
                alert('Please fill in all fields');
                return;
            }

            if (editMode) {
                students[editCourse][editIndex] = { rollNo, name, course, section };
                
                if (editCourse !== course) {
                    students[editCourse].splice(editIndex, 1);
                    if (students[editCourse].length === 0) {
                        delete students[editCourse];
                    }
                    if (!students[course]) {
                        students[course] = [];
                    }
                    students[course].push({ rollNo, name, course, section });
                }
                
                exitEditMode();
            } else {
                const student = { rollNo, name, course, section };
                
                if (!students[course]) {
                    students[course] = [];
                }
                
                students[course].push(student);
            }
            
            clearForm();
            displayStudents();
        }

        function editStudent(courseName, index) {
            const student = students[courseName][index];
            
            document.getElementById('rollNo').value = student.rollNo;
            document.getElementById('name').value = student.name;
            document.getElementById('course').value = student.course;
            document.getElementById('section').value = student.section;
            
            editMode = true;
            editCourse = courseName;
            editIndex = index;
            
            document.getElementById('formTitle').textContent = 'Update Student';
            document.getElementById('addBtn').textContent = 'Update Student';
            document.getElementById('cancelBtn').style.display = 'block';
            
            document.getElementById('rollNo').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exitEditMode() {
            editMode = false;
            editCourse = null;
            editIndex = null;
            
            document.getElementById('formTitle').textContent = 'Add New Student';
            document.getElementById('addBtn').textContent = 'Add Student';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function cancelEdit() {
            clearForm();
            exitEditMode();
        }

        function deleteStudent(courseName, index) {
            if (confirm('Are you sure you want to delete this student?')) {
                students[courseName].splice(index, 1);
                
                if (students[courseName].length === 0) {
                    delete students[courseName];
                }
                
                displayStudents();
            }
        }

        function clearForm() {
            document.getElementById('rollNo').value = '';
            document.getElementById('name').value = '';
            document.getElementById('course').value = '';
            document.getElementById('section').value = '';
        }

        function displayStudents() {
            const container = document.getElementById('studentsContainer');
            container.innerHTML = '';
            
            const courseNames = Object.keys(students);
            
            if (courseNames.length === 0) {
                container.innerHTML = '<div class="course-section"><div class="no-students">No students added yet. Add your first student above!</div></div>';
                return;
            }
            
            courseNames.forEach(courseName => {
                const courseSection = document.createElement('div');
                courseSection.className = 'course-section';
                
                const courseHeader = document.createElement('div');
                courseHeader.className = 'course-header';
                const heading = document.createElement('h2');
                heading.textContent = courseName;
                courseHeader.appendChild(heading);
                courseSection.appendChild(courseHeader);
                
                const table = document.createElement('table');
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Section</th>
                        <th>Actions</th>
                    </tr>
                `;
                table.appendChild(thead);
                
                const tbody = document.createElement('tbody');
                students[courseName].forEach((student, index) => {
                    const tr = document.createElement('tr');
                    
                    const td1 = document.createElement('td');
                    td1.textContent = student.rollNo;
                    tr.appendChild(td1);
                    
                    const td2 = document.createElement('td');
                    td2.textContent = student.name;
                    tr.appendChild(td2);
                    
                    const td3 = document.createElement('td');
                    td3.textContent = student.section;
                    tr.appendChild(td3);
                    
                    const td4 = document.createElement('td');
                    const actionButtons = document.createElement('div');
                    actionButtons.className = 'action-buttons';
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn';
                    editBtn.textContent = 'Edit';
                    editBtn.onclick = function() {
                        editStudent(courseName, index);
                    };
                    actionButtons.appendChild(editBtn);
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = function() {
                        deleteStudent(courseName, index);
                    };
                    actionButtons.appendChild(deleteBtn);
                    
                    td4.appendChild(actionButtons);
                    tr.appendChild(td4);
                    
                    tbody.appendChild(tr);
                });
                
                table.appendChild(tbody);
                courseSection.appendChild(table);
                container.appendChild(courseSection);
            });
        }

        document.getElementById('addBtn').addEventListener('click', addStudent);
        document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
        
        displayStudents();
    </script>
</body>
</html>
