<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .calculator { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); text-align: center; width: 320px; }
    #display { width: 90%; padding: 10px; font-size: 20px; margin-bottom: 10px; text-align: right; border: 1px solid #ccc; border-radius: 5px; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 15px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #45a049; }
    #result { margin-top: 15px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Scientific Calculator</h2>
    <input type="text" id="display" placeholder="0">
    <div class="buttons">
      <button onclick="append('+')">+</button>
      <button onclick="append('-')">−</button>
      <button onclick="append('*')">×</button>
      <button onclick="append('/')">÷</button>

      <button onclick="append('%')">%</button>
      <button onclick="append('**')">x^y</button>
      <button onclick="append('Math.sqrt(')">√</button>
      <button onclick="append('Math.log(')">log</button>

      <button onclick="append('Math.sin(')">sin</button>
      <button onclick="append('Math.cos(')">cos</button>
      <button onclick="append('Math.tan(')">tan</button>
      <button onclick="append('Math.PI')">π</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('(')">(</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append(')')">)</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('.')">.</button>

      <button onclick="append('0')">0</button>
      <button onclick="clearDisplay()">C</button>
      <button onclick="calculate()">=</button>
      <button onclick="backspace()">←</button>
    </div>
    <p id="result">Result: </p>
  </div>

  <script>
    function append(value) {
      document.getElementById("display").value += value;
    }
    function clearDisplay() {
      document.getElementById("display").value = "";
      document.getElementById("result").innerText = "Result: ";
    }
    function backspace() {
      let current = document.getElementById("display").value;
      document.getElementById("display").value = current.slice(0, -1);
    }
    function calculate() {
      let expression = document.getElementById("display").value;
      let result;
      try {
        result = eval(expression);
      } catch (e) {
        result = "Error!";
      }
      document.getElementById("result").innerText = "Result: " + result;
    }
  </script>
</body>
</html>
